<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELIOS' JARVIS</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23090a0f' stroke='%23f59e0b' stroke-width='6'/><circle cx='50' cy='50' r='20' fill='%23f59e0b'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23e2e8f0' stroke-width='3' stroke-dasharray='10 6'/></svg>" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#090a0f',
            brandWhite: '#ffffff',
            brandLightGrey: '#e2e8f0',
            brandGrey: '#94a3b8',
            amberAccent: '#f59e0b',
            cyanAccent: '#06b6d4',
            redAccent: '#ef4444'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090a0f;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    
    .font-brand { font-family: 'Space Grotesk', sans-serif; }

    .glass-card {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .launcher-item {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease;
    }
    .launcher-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
    }

    .core-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .core-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.35);
    }

    .ambient-glow {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, rgba(6, 182, 212, 0.03) 40%, transparent 70%);
      pointer-events: none;
    }

    canvas { display: block; outline: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(9, 10, 15, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.5); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function useLiveClock() {
      const [time, setTime] = useState('');
      useEffect(() => {
        const update = () => {
          const now = new Date();
          setTime(now.toLocaleTimeString('en-GB', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          }));
        };
        update();
        const interval = setInterval(update, 1000);
        return () => clearInterval(interval);
      }, []);
      return time;
    }

    function useWeather() {
      const [weather, setWeather] = useState({
        temp: null, wind: null, condition: 'Fetching…', location: 'Detecting…', loading: true, error: null
      });

      useEffect(() => {
        let active = true;
        const conditionCodeMap = {
          0:'Clear Sky', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
          45:'Foggy', 48:'Depositing Rime Fog', 51:'Light Drizzle', 53:'Moderate Drizzle', 55:'Dense Drizzle',
          61:'Slight Rain', 63:'Moderate Rain', 65:'Heavy Rain', 71:'Slight Snowfall', 73:'Moderate Snowfall', 75:'Heavy Snowfall',
          80:'Slight Rain Showers', 81:'Moderate Rain Showers', 82:'Violent Rain Showers', 95:'Thunderstorm', 96:'Thunderstorm with Hail'
        };

        async function fetchWeather(lat, lon, locationLabel) {
          try {
            const endpoint = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code&timezone=auto`;
            const response = await fetch(endpoint);
            const json = await response.json();
            if (!active) return;
            setWeather({
              temp: Math.round(json.current.temperature_2m),
              wind: Math.round(json.current.wind_speed_10m),
              condition: conditionCodeMap[json.current.weather_code] || 'Unsettled',
              location: locationLabel || `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`,
              loading: false, error: null
            });
          } catch (err) {
            if (active) setWeather(prev => ({ ...prev, loading: false, error: 'Telemetry Offline' }));
          }
        }

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
            () => fetchWeather(51.5074, -0.1278, 'London, UK'),
            { timeout: 8000 }
          );
        } else {
          fetchWeather(51.5074, -0.1278, 'London, UK');
        }

        return () => { active = false; };
      }, []);

      return weather;
    }

    // ─── High-Tech Cybernetic Holographic JARVIS Core ───
    function Jarvis3DCore({ isListening, isSpeaking, audioLevel, currentMode }) {
      const mountRef = useRef(null);
      const stateRef = useRef({ isListening, isSpeaking, audioLevel, currentMode });

      useEffect(() => {
        stateRef.current = { isListening, isSpeaking, audioLevel, currentMode };
      }, [isListening, isSpeaking, audioLevel, currentMode]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        let width = container.clientWidth || 400;
        let height = container.clientHeight || 340;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const jarvisGroup = new THREE.Group();
        scene.add(jarvisGroup);

        // 1. Particle Sphere Grid Core
        const particleCount = 700;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = 1.0;

          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
          color: 0xf59e0b,
          size: 0.035,
          transparent: true,
          opacity: 0.85
        });
        const particleSphere = new THREE.Points(particleGeo, particleMat);
        jarvisGroup.add(particleSphere);

        // 2. High-Tech Dual Arc Reactor Rings
        const ring1Geo = new THREE.TorusGeometry(1.4, 0.012, 16, 100);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        jarvisGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(1.7, 0.008, 16, 100);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.6 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2.5;
        jarvisGroup.add(ring2);

        // 3. Central Inner Pulsing Energy Core
        const coreGeo = new THREE.IcosahedronGeometry(0.4, 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        jarvisGroup.add(coreMesh);

        const clock = new THREE.Clock();
        let frameId;

        function renderLoop() {
          frameId = requestAnimationFrame(renderLoop);
          const t = clock.getElapsedTime();
          const { isListening: activeListen, isSpeaking: activeSpeak, audioLevel: level, currentMode: mode } = stateRef.current;

          let hexColor = 0xf59e0b;
          let ringColor = 0x06b6d4;

          if (mode === 'STEALTH') {
            hexColor = 0x475569;
            ringColor = 0x64748b;
          } else if (mode === 'OVERDRIVE') {
            hexColor = 0xef4444;
            ringColor = 0xd97706;
          }

          particleMat.color.setHex(hexColor);
          ring2Mat.color.setHex(hexColor);
          ring1Mat.color.setHex(ringColor);

          const speedMult = mode === 'OVERDRIVE' ? 2.2 : mode === 'STEALTH' ? 0.4 : 1.0;
          const talkMult = activeSpeak ? 2.5 : activeListen ? 1.6 : 1.0;

          jarvisGroup.rotation.y = t * 0.3 * speedMult * talkMult;
          ring1.rotation.x = t * 0.5 * speedMult;
          ring1.rotation.y = t * 0.3 * speedMult;
          ring2.rotation.z = t * -0.4 * speedMult;
          coreMesh.rotation.y = t * -0.8 * speedMult;

          const audioScale = activeSpeak ? 1 + level * 0.4 : 1 + Math.sin(t * 3) * 0.05;
          particleSphere.scale.setScalar(audioScale);
          coreMesh.scale.setScalar(audioScale * 0.9);

          renderer.render(scene, camera);
        }

        renderLoop();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };

        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="w-full h-full min-h-[340px] flex items-center justify-center" />;
    }

    function App() {
      const time = useLiveClock();
      const weather = useWeather();

      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [audioLevel, setAudioLevel] = useState(0);
      const [transcript, setTranscript] = useState('');
      const [jarvisResponse, setJarvisResponse] = useState('');
      const [systemStatus, setSystemStatus] = useState('ONLINE & READY');
      const [systemMode, setSystemMode] = useState('STANDARD');

      // Command Terminal Engine (Replaces Scratchpad)
      const [cliInput, setCliInput] = useState('');
      const [cliLogs, setCliLogs] = useState([
        { id: 1, type: 'sys', text: 'Helios Command Terminal initialized.' },
        { id: 2, type: 'sys', text: 'Type "help" for executable system functions.' }
      ]);

      const [cpuLoad, setCpuLoad] = useState(18);
      const [memoryLoad, setMemoryLoad] = useState(34);

      useEffect(() => {
        const interval = setInterval(() => {
          const cpuBase = systemMode === 'OVERDRIVE' ? 75 : systemMode === 'STEALTH' ? 8 : 18;
          const ramBase = systemMode === 'OVERDRIVE' ? 68 : systemMode === 'STEALTH' ? 22 : 34;
          setCpuLoad(Math.floor(cpuBase + Math.random() * 12));
          setMemoryLoad(Math.floor(ramBase + Math.random() * 6));
        }, 2000);
        return () => clearInterval(interval);
      }, [systemMode]);

      const [links, setLinks] = useState(() => {
        const stored = localStorage.getItem('jarvis_links_v4');
        if (stored) {
          try { return JSON.parse(stored); } catch (e) {}
        }
        return [
          { id: 1, title: 'GitHub HQ', url: 'https://github.com', tag: 'DEV' },
          { id: 2, title: 'Vercel Console', url: 'https://vercel.com', tag: 'DEPLOY' },
          { id: 3, title: 'OpenAI Docs', url: 'https://platform.openai.com', tag: 'INTELLIGENCE' },
          { id: 4, title: 'BBC News', url: 'https://www.bbc.co.uk/news', tag: 'MEDIA' }
        ];
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [inputTitle, setInputTitle] = useState('');
      const [inputUrl, setInputUrl] = useState('');
      const [inputTag, setInputTag] = useState('');

      const recognitionRef = useRef(null);
      const synthRef = useRef(window.speechSynthesis);
      const speechActiveRef = useRef(false);

      useEffect(() => {
        localStorage.setItem('jarvis_links_v4', JSON.stringify(links));
      }, [links]);

      const speakResponse = useCallback((text) => {
        if (!text) return;
        synthRef.current.cancel();
        speechActiveRef.current = true;
        setIsSpeaking(true);
        setJarvisResponse(text);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        const voices = synthRef.current.getVoices();
        const preferredVoice = voices.find(v => 
          v.lang === 'en-GB' && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Oliver') || v.name.includes('George') || v.name.includes('Daniel'))
        ) || voices.find(v => v.lang === 'en-GB');

        if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onend = () => {
          speechActiveRef.current = false;
          setIsSpeaking(false);
          setAudioLevel(0);
        };
        utterance.onerror = () => {
          speechActiveRef.current = false;
          setIsSpeaking(false);
          setAudioLevel(0);
        };

        const intervalId = setInterval(() => {
          if (!speechActiveRef.current) {
            clearInterval(intervalId);
            return;
          }
          setAudioLevel(0.2 + Math.random() * 0.8);
        }, 80);

        synthRef.current.speak(utterance);
      }, []);

      const executeSystemCommand = useCallback((cmdRaw) => {
        const cmd = cmdRaw.trim().toLowerCase();
        if (!cmd) return;

        setCliLogs(prev => [...prev, { id: Date.now(), type: 'user', text: `> ${cmdRaw}` }]);

        if (cmd === 'help') {
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'sys', text: 'Commands: mode standard | mode stealth | mode overdrive | weather | clear | info' }]);
        } else if (cmd === 'mode standard') {
          setSystemMode('STANDARD');
          speakResponse('Standard mode active.');
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'out', text: 'System mode set to STANDARD.' }]);
        } else if (cmd === 'mode stealth') {
          setSystemMode('STEALTH');
          speakResponse('Stealth mode active.');
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'out', text: 'System mode set to STEALTH.' }]);
        } else if (cmd === 'mode overdrive') {
          setSystemMode('OVERDRIVE');
          speakResponse('Overdrive mode active.');
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'out', text: 'System mode set to OVERDRIVE.' }]);
        } else if (cmd === 'clear') {
          setCliLogs([]);
        } else if (cmd === 'weather') {
          const resp = weather.loading ? 'Syncing weather telemetry...' : `Local weather is ${weather.temp}°C with ${weather.condition}.`;
          speakResponse(resp);
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'out', text: resp }]);
        } else {
          setCliLogs(prev => [...prev, { id: Date.now() + 1, type: 'err', text: `Unknown command: "${cmdRaw}". Type "help" for options.` }]);
        }
      }, [speakResponse, weather]);

      const handleCliSubmit = (e) => {
        e.preventDefault();
        executeSystemCommand(cliInput);
        setCliInput('');
      };

      const handleVoiceCommand = useCallback((rawText) => {
        const text = (rawText || '').toLowerCase().trim();
        if (!text) {
          speakResponse('I beg your pardon, sir. I did not catch that.');
          return;
        }

        if (text.includes('weather') || text.includes('temperature')) {
          if (weather.loading) {
            speakResponse('Telemetry feeds are currently synchronising, sir.');
          } else if (weather.error) {
            speakResponse('Unable to acquire weather telemetry at this moment.');
          } else {
            speakResponse(`Current local weather stands at ${weather.temp} degrees celsius with ${weather.condition.toLowerCase()}.`);
          }
          return;
        }

        if (text.includes('time') || text.includes('clock')) {
          const currentTime = new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true });
          speakResponse(`The time is precisely ${currentTime}, sir.`);
          return;
        }

        if (text.includes('stealth')) {
          setSystemMode('STEALTH');
          speakResponse('Stealth protocols initiated, sir. Power consumption minimised.');
          return;
        }

        if (text.includes('overdrive')) {
          setSystemMode('OVERDRIVE');
          speakResponse('Overdrive engaged. Performance parameters operating at full capacity.');
          return;
        }

        if (text.includes('normal') || text.includes('standard')) {
          setSystemMode('STANDARD');
          speakResponse('Returning core parameters to standard baseline.');
          return;
        }

        if (text.includes('status') || text.includes('diagnostics')) {
          speakResponse(`All primary systems operational, sir. CPU at ${cpuLoad} percent, memory allocation at ${memoryLoad} percent.`);
          return;
        }

        speakResponse(`Understood, sir. Command registered: "${rawText}".`);
      }, [speakResponse, weather, cpuLoad, memoryLoad]);

      const startListening = useCallback(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          speakResponse('Speech recognition hardware is unavailable on this terminal.');
          return;
        }

        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 3;
        recognition.lang = 'en-GB';

        recognition.onstart = () => {
          setIsListening(true);
          setSystemStatus('LISTENING TO COMMAND');
          setTranscript('');
        };

        recognition.onresult = (e) => {
          let currentTranscript = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            currentTranscript += e.results[i][0].transcript;
          }
          setTranscript(currentTranscript);
          if (e.results[e.results.length - 1].isFinal) {
            handleVoiceCommand(currentTranscript);
          }
        };

        recognition.onerror = () => {
          setIsListening(false);
          setSystemStatus('ONLINE & READY');
        };

        recognition.onend = () => {
          setIsListening(false);
          setSystemStatus('ONLINE & READY');
        };

        recognitionRef.current = recognition;
        try { recognition.start(); } catch (e) {}
      }, [handleVoiceCommand, speakResponse]);

      const stopListening = useCallback(() => {
        setIsListening(false);
        setSystemStatus('ONLINE & READY');
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
      }, []);

      const toggleMic = useCallback(() => {
        synthRef.current.cancel();
        speechActiveRef.current = false;
        setIsSpeaking(false);

        if (isListening) stopListening();
        else startListening();
      }, [isListening, startListening, stopListening]);

      const handleAddLink = (e) => {
        e.preventDefault();
        if (!inputTitle || !inputUrl) return;
        let formatted = inputUrl.trim();
        if (!/^https?:\/\//i.test(formatted)) {
          formatted = 'https://' + formatted;
        }
        setLinks([...links, {
          id: Date.now(),
          title: inputTitle.trim(),
          url: formatted,
          tag: (inputTag.trim() || 'LINK').toUpperCase()
        }]);
        setInputTitle('');
        setInputUrl('');
        setInputTag('');
        setIsModalOpen(false);
      };

      const handleRemoveLink = (id, e) => {
        e.preventDefault();
        e.stopPropagation();
        setLinks(links.filter(l => l.id !== id));
      };

      return (
        <div className="min-h-screen w-full bg-obsidian text-slate-100 flex flex-col justify-between relative overflow-hidden p-6 md:p-10">
          
          <div className="ambient-glow" />

          {/* HEADER WITH LOGO */}
          <header className="relative z-10 flex items-center justify-between pb-6 border-b border-slate-800/80 mb-8">
            <div className="flex items-center gap-3.5">
              <div className="relative w-8 h-8 flex items-center justify-center">
                <div className="absolute inset-0 rounded-full border-2 border-amberAccent/40 animate-ping" />
                <div className="w-6 h-6 rounded-full border-2 border-amberAccent flex items-center justify-center bg-slate-900">
                  <div className="w-2.5 h-2.5 rounded-full bg-amberAccent" />
                </div>
              </div>
              <h1 className="font-brand text-2xl md:text-3xl font-bold tracking-widest text-brandWhite">
                HELIOS' JARVIS
              </h1>
            </div>

            <div className="flex items-center gap-6">
              {/* Functional System Modes */}
              <div className="hidden sm:flex items-center gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-[11px] font-mono">
                {[
                  { id: 'STANDARD', label: 'STANDARD' },
                  { id: 'STEALTH', label: 'STEALTH' },
                  { id: 'OVERDRIVE', label: 'OVERDRIVE' }
                ].map(m => (
                  <button
                    key={m.id}
                    onClick={() => {
                      setSystemMode(m.id);
                      speakResponse(`${m.label.toLowerCase()} mode activated, sir.`);
                    }}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      systemMode === m.id 
                        ? m.id === 'STEALTH' 
                          ? 'bg-slate-700 text-white font-bold' 
                          : m.id === 'OVERDRIVE' 
                          ? 'bg-redAccent text-white font-bold' 
                          : 'bg-amberAccent text-obsidian font-bold'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {m.label}
                  </button>
                ))}
              </div>

              <div className="px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-slate-300 bg-slate-900/80 border border-slate-700/60 flex items-center gap-2.5">
                <span className={`w-2 h-2 rounded-full ${
                  systemMode === 'STEALTH' ? 'bg-slate-500' : systemMode === 'OVERDRIVE' ? 'bg-redAccent animate-ping' : isListening ? 'bg-amberAccent animate-ping' : 'bg-emerald-400'
                }`} />
                {systemStatus}
              </div>

              <div className="hidden lg:block font-mono text-sm font-semibold text-brandLightGrey bg-slate-900/90 px-4 py-1.5 rounded-xl border border-slate-800">
                {time || '00:00:00'}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="relative z-10 grid grid-cols-12 gap-8 my-auto items-stretch">
            
            {/* LEFT COLUMN */}
            <div className="col-span-12 lg:col-span-3 flex flex-col justify-between gap-6">
              
              <div className="glass-card rounded-2xl p-6 border-l-4 border-l-amberAccent">
                <div className="text-[11px] font-brand uppercase tracking-widest text-brandGrey mb-2">TELEMETRY & TIME</div>
                <div className="text-sm font-semibold text-brandLightGrey mb-1">{weather.location}</div>
                <div className="text-3xl font-extrabold font-brand text-brandWhite tracking-wider">
                  {time || '00:00:00'}
                </div>
              </div>

              <div className="glass-card rounded-2xl p-6 border-l-4 border-l-amberAccent">
                <div className="text-[11px] font-brand uppercase tracking-widest text-brandGrey mb-3">ENVIRONMENTAL FEED</div>
                {weather.loading ? (
                  <div className="text-slate-500 text-xs animate-pulse">Syncing satellite telemetry…</div>
                ) : weather.error ? (
                  <div className="text-rose-400 text-xs">{weather.error}</div>
                ) : (
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-4xl font-black text-brandWhite">{weather.temp}°</div>
                      <div className="text-xs text-brandGrey mt-1">{weather.condition}</div>
                    </div>
                    <div className="text-right border-l border-slate-800 pl-4">
                      <div className="text-[10px] text-slate-500 uppercase tracking-wider">WIND SPEED</div>
                      <div className="text-sm font-bold text-brandLightGrey">{weather.wind} km/h</div>
                    </div>
                  </div>
                )}
              </div>

              <div className="glass-card rounded-2xl p-6 flex-1 flex flex-col justify-center">
                <div className="text-[11px] font-brand uppercase tracking-widest text-brandGrey mb-4">DIRECTIVE COMMANDS</div>
                <div className="flex flex-col gap-3">
                  {[
                    "What's the weather?",
                    'What time is it?',
                    'System diagnostics',
                    'Engage stealth mode'
                  ].map(cmd => (
                    <button
                      key={cmd}
                      onClick={() => {
                        synthRef.current.cancel();
                        setTranscript(cmd);
                        handleVoiceCommand(cmd);
                      }}
                      className="w-full text-left px-4 py-3 rounded-xl text-xs font-medium text-slate-300 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all flex items-center justify-between group"
                    >
                      <span>{cmd}</span>
                      <span className="text-amberAccent opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                    </button>
                  ))}
                </div>
              </div>

            </div>

            {/* CENTER COLUMN: REMADE JARVIS CORE */}
            <div className="col-span-12 lg:col-span-6 flex flex-col items-center justify-between gap-6 py-2">
              
              <div className="w-full h-[360px] relative flex items-center justify-center">
                <Jarvis3DCore 
                  isListening={isListening} 
                  isSpeaking={isSpeaking} 
                  audioLevel={audioLevel}
                  currentMode={systemMode}
                />
              </div>

              <button
                onClick={toggleMic}
                className={`core-btn px-10 py-4 rounded-full font-brand text-xs font-bold tracking-widest flex items-center gap-3.5 ${
                  isListening
                    ? 'bg-amberAccent text-obsidian shadow-[0_0_30px_rgba(245,158,11,0.5)]'
                    : 'bg-slate-900 border border-slate-700 text-brandWhite hover:border-amberAccent'
                }`}
              >
                <span className={`w-3 h-3 rounded-full ${isListening ? 'bg-obsidian animate-ping' : 'bg-amberAccent'}`} />
                {isListening ? 'HALT VOICE INPUT' : "INITIALIZE HELIOS' JARVIS"}
              </button>

              <div className="w-full max-w-md glass-card rounded-2xl p-5 border-t-2 border-t-amberAccent min-h-[90px] flex flex-col justify-center">
                <div className="text-[10px] font-brand tracking-widest text-brandGrey mb-1.5 uppercase text-center">COMMUNICATION FEED</div>
                <div className="text-xs font-mono text-brandWhite text-center">
                  {transcript ? `> ${transcript}` : <span className="text-slate-600">Awaiting voice command input…</span>}
                </div>
                {jarvisResponse && (
                  <div className="mt-2.5 pt-2 border-t border-slate-800 text-xs font-mono text-amberAccent text-center">
                    JARVIS: {jarvisResponse}
                  </div>
                )}
              </div>

            </div>

            {/* RIGHT COLUMN */}
            <div className="col-span-12 lg:col-span-3 flex flex-col gap-6">
              
              <div className="glass-card rounded-2xl p-6 flex-1 flex flex-col justify-between border-r-4 border-r-amberAccent">
                <div>
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                    <span className="text-[11px] font-brand uppercase tracking-widest text-brandGrey">ACTION LAUNCHER</span>
                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-semibold text-brandWhite transition-all"
                    >
                      + ADD LINK
                    </button>
                  </div>

                  <div className="flex flex-col gap-3 overflow-y-auto max-h-[260px] pt-2 pr-1">
                    {links.map(link => (
                      <a
                        key={link.id}
                        href={link.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="launcher-item flex items-center justify-between px-4 py-3.5 rounded-xl bg-slate-900/50 border border-slate-800/80 group"
                      >
                        <div>
                          <div className="text-xs font-semibold text-brandWhite group-hover:text-amberAccent transition-colors">
                            {link.title}
                          </div>
                          <div className="text-[9px] font-brand text-slate-500 tracking-wider mt-0.5">{link.tag}</div>
                        </div>
                        
                        <div className="flex items-center gap-3">
                          <button
                            onClick={(e) => handleRemoveLink(link.id, e)}
                            className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition-all text-xs px-1"
                            title="Remove Shortcut"
                          >
                            ✕
                          </button>
                          <span className="text-slate-600 group-hover:text-amberAccent text-xs">↗</span>
                        </div>
                      </a>
                    ))}
                  </div>
                </div>
              </div>

              {/* INNOVATIVE REPLACEMENT: Command Terminal Engine */}
              <div className="glass-card rounded-2xl p-4 border-l-2 border-l-cyanAccent">
                <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey mb-2 flex justify-between">
                  <span>COMMAND TERMINAL</span>
                  <span className="text-cyanAccent font-mono">CLI ACTIVE</span>
                </div>
                
                <div className="w-full h-20 bg-slate-950/90 border border-slate-800 rounded-xl p-2.5 text-[11px] font-mono overflow-y-auto flex flex-col gap-1 mb-2">
                  {cliLogs.map(log => (
                    <div key={log.id} className={
                      log.type === 'user' ? 'text-amberAccent' :
                      log.type === 'err' ? 'text-rose-400' :
                      log.type === 'out' ? 'text-cyanAccent' : 'text-slate-400'
                    }>
                      {log.text}
                    </div>
                  ))}
                </div>

                <form onSubmit={handleCliSubmit} className="flex gap-2">
                  <input
                    type="text"
                    value={cliInput}
                    onChange={(e) => setCliInput(e.target.value)}
                    placeholder='Type "help" or command...'
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyanAccent"
                  />
                  <button type="submit" className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-cyanAccent border border-slate-700">
                    EXEC
                  </button>
                </form>
              </div>

              <div className="glass-card rounded-2xl p-4 border-l-2 border-l-slate-600">
                <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey mb-2">HARDWARE MONITOR</div>
                <div className="space-y-2 text-xs">
                  <div>
                    <div className="flex justify-between text-[11px] text-slate-400 mb-1">
                      <span>CPU ALLOCATION</span>
                      <span className="font-mono text-amberAccent">{cpuLoad}%</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                      <div className="bg-amberAccent h-1.5 transition-all duration-500" style={{ width: `${cpuLoad}%` }}></div>
                    </div>
                  </div>
                  <div>
                    <div className="flex justify-between text-[11px] text-slate-400 mb-1">
                      <span>RAM ALLOCATION</span>
                      <span className="font-mono text-cyanAccent">{memoryLoad}%</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                      <div className="bg-cyanAccent h-1.5 transition-all duration-500" style={{ width: `${memoryLoad}%` }}></div>
                    </div>
                  </div>
                </div>
              </div>

            </div>

          </main>

          <footer className="relative z-10 pt-6 border-t border-slate-800/80 flex items-center justify-between text-[11px] font-mono text-slate-500 mt-8">
            <div>HELIOS CORE SYSTEM V3.3</div>
            <div>BRITISH ENGLISH VOICE PARSER ACTIVE</div>
          </footer>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700">
                <div className="flex items-center justify-between mb-5 border-b border-slate-800 pb-3">
                  <h3 className="font-brand text-sm font-bold text-brandWhite">ADD NEW SHORTCUT</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-500 hover:text-brandWhite">✕</button>
                </div>
                
                <form onSubmit={handleAddLink} className="flex flex-col gap-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1.5 font-medium">TITLE</label>
                    <input 
                      type="text" 
                      placeholder="e.g. BBC Sport" 
                      value={inputTitle}
                      onChange={(e) => setInputTitle(e.target.value)}
                      required
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amberAccent"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1.5 font-medium">URL</label>
                    <input 
                      type="text" 
                      placeholder="e.g. bbc.co.uk/sport" 
                      value={inputUrl}
                      onChange={(e) => setInputUrl(e.target.value)}
                      required
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amberAccent"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1.5 font-medium">TAG / CATEGORY</label>
                    <input 
                      type="text" 
                      placeholder="e.g. SPORT" 
                      value={inputTag}
                      onChange={(e) => setInputTag(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amberAccent"
                    />
                  </div>

                  <div className="flex justify-end gap-3 mt-3">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700"
                    >
                      CANCEL
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2.5 rounded-xl bg-amberAccent text-obsidian font-bold hover:bg-amber-400 transition-all"
                    >
                      SAVE SHORTCUT
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
