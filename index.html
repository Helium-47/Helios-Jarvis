<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELIOS' JARVIS</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23090a0f' stroke='%23f59e0b' stroke-width='6'/><circle cx='50' cy='50' r='20' fill='%23f59e0b'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23e2e8f0' stroke-width='3' stroke-dasharray='10 6'/></svg>" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#090a0f',
            brandWhite: '#ffffff',
            brandLightGrey: '#e2e8f0',
            brandGrey: '#94a3b8',
            amberAccent: '#f59e0b',
            cyanAccent: '#06b6d4'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090a0f;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    
    .font-brand { font-family: 'Space Grotesk', sans-serif; }

    .glass-card {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .core-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .core-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.35);
    }

    .ambient-glow {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, rgba(6, 182, 212, 0.03) 40%, transparent 70%);
      pointer-events: none;
    }

    canvas { display: block; outline: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(9, 10, 15, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function useLiveClock() {
      const [time, setTime] = useState('');
      useEffect(() => {
        const update = () => {
          const now = new Date();
          setTime(now.toLocaleTimeString('en-GB', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          }));
        };
        update();
        const interval = setInterval(update, 1000);
        return () => clearInterval(interval);
      }, []);
      return time;
    }

    function useWeather() {
      const [weather, setWeather] = useState({
        temp: null, wind: null, condition: 'Fetching…', location: 'Detecting…', loading: true, error: null
      });

      useEffect(() => {
        let active = true;
        const conditionCodeMap = {
          0:'Clear Sky', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
          45:'Foggy', 48:'Depositing Rime Fog', 51:'Light Drizzle', 61:'Slight Rain', 63:'Moderate Rain', 95:'Thunderstorm'
        };

        async function fetchWeather(lat, lon, locationLabel) {
          try {
            const endpoint = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code&timezone=auto`;
            const response = await fetch(endpoint);
            const json = await response.json();
            if (!active) return;
            setWeather({
              temp: Math.round(json.current.temperature_2m),
              wind: Math.round(json.current.wind_speed_10m),
              condition: conditionCodeMap[json.current.weather_code] || 'Unsettled',
              location: locationLabel || `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`,
              loading: false, error: null
            });
          } catch (err) {
            if (active) setWeather(prev => ({ ...prev, loading: false, error: 'Telemetry Offline' }));
          }
        }

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
            () => fetchWeather(51.5074, -0.1278, 'London, UK'),
            { timeout: 8000 }
          );
        } else {
          fetchWeather(51.5074, -0.1278, 'London, UK');
        }
        return () => { active = false; };
      }, []);

      return weather;
    }

    function Jarvis3DCore({ isListening, isSpeaking, audioLevel, currentMode }) {
      const mountRef = useRef(null);
      const stateRef = useRef({ isListening, isSpeaking, audioLevel, currentMode });

      useEffect(() => {
        stateRef.current = { isListening, isSpeaking, audioLevel, currentMode };
      }, [isListening, isSpeaking, audioLevel, currentMode]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        let width = container.clientWidth || 500;
        let height = container.clientHeight || 450;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 5.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const jarvisGroup = new THREE.Group();
        scene.add(jarvisGroup);

        const particleCount = 1000;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = 1.35;

          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xf59e0b, size: 0.038, transparent: true, opacity: 0.85 });
        const particleSphere = new THREE.Points(particleGeo, particleMat);
        jarvisGroup.add(particleSphere);

        const ring1Geo = new THREE.TorusGeometry(1.85, 0.014, 16, 100);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        jarvisGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(2.15, 0.009, 16, 100);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.6 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2.5;
        jarvisGroup.add(ring2);

        const coreGeo = new THREE.IcosahedronGeometry(0.55, 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        jarvisGroup.add(coreMesh);

        const clock = new THREE.Clock();
        let frameId;

        function renderLoop() {
          frameId = requestAnimationFrame(renderLoop);
          const t = clock.getElapsedTime();
          const { isListening: activeListen, isSpeaking: activeSpeak, audioLevel: level, currentMode: mode } = stateRef.current;

          let hexColor = 0xf59e0b;
          let ringColor = 0x06b6d4;

          if (mode === 'FOCUS') {
            hexColor = 0x475569;
            ringColor = 0x64748b;
          }

          particleMat.color.setHex(hexColor);
          ring2Mat.color.setHex(hexColor);
          ring1Mat.color.setHex(ringColor);

          const speedMult = mode === 'FOCUS' ? 0.3 : 1.0;
          const talkMult = activeSpeak ? 2.5 : activeListen ? 1.6 : 1.0;

          jarvisGroup.rotation.y = t * 0.3 * speedMult * talkMult;
          ring1.rotation.x = t * 0.5 * speedMult;
          ring2.rotation.z = t * -0.4 * speedMult;
          coreMesh.rotation.y = t * -0.8 * speedMult;

          const audioScale = activeSpeak ? 1 + level * 0.4 : 1 + Math.sin(t * 3) * 0.05;
          particleSphere.scale.setScalar(audioScale);
          coreMesh.scale.setScalar(audioScale * 0.9);

          renderer.render(scene, camera);
        }

        renderLoop();
        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);
        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
        };
      }, []);

      return <div ref={mountRef} className="w-full h-full min-h-[420px] flex items-center justify-center" />;
    }

    function App() {
      const time = useLiveClock();
      const weather = useWeather();

      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [audioLevel, setAudioLevel] = useState(0);
      const [transcript, setTranscript] = useState('');
      const [jarvisResponse, setJarvisResponse] = useState('');
      const [systemStatus, setSystemStatus] = useState('OFFLINE');
      const [systemMode, setSystemMode] = useState('STANDARD');
      const [pendingAction, setPendingAction] = useState(null);

      const [cpuLoad, setCpuLoad] = useState(14);
      const [memoryLoad, setMemoryLoad] = useState(29);

      const [directiveCommands, setDirectiveCommands] = useState([
        { label: "What's the weather?", action: "weather" },
        { label: "What time is it?", action: "time" },
        { label: "System diagnostics", action: "diagnostics" },
        { label: "Open Gemini", action: "gemini", url: "https://gemini.google.com" },
        { label: "Open Google", action: "google", url: "https://www.google.com" }
      ]);
      const [newDirective, setNewDirective] = useState('');

      const [webAutomations, setWebAutomations] = useState([
        { keyword: 'gemini', name: 'Google Gemini', url: 'https://gemini.google.com' },
        { keyword: 'google', name: 'Google Search', url: 'https://www.google.com' },
        { keyword: 'github', name: 'GitHub HQ', url: 'https://github.com' },
        { keyword: 'youtube', name: 'YouTube', url: 'https://www.youtube.com' }
      ]);
      const [newKeyword, setNewKeyword] = useState('');
      const [newUrl, setNewUrl] = useState('');

      const synthRef = useRef(window.speechSynthesis);
      const speechActiveRef = useRef(false);
      const recognitionRef = useRef(null);

      const speakResponse = useCallback((text, callback) => {
        if (!text) return;
        synthRef.current.cancel();
        speechActiveRef.current = true;
        setIsSpeaking(true);
        setJarvisResponse(text);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = 0.90; // Slower cadence to sound less robotic and more grounded
        utterance.pitch = 0.72; // Deep, natural chest-resonance tone

        const voices = synthRef.current.getVoices();
        // Look for natural offline or high quality voices
        const britishMale = voices.find(v => 
          v.lang === 'en-GB' && (
            v.name.includes('Google UK English Male') || 
            v.name.includes('Daniel') || 
            v.name.includes('Oliver') || 
            v.name.includes('George') ||
            v.name.includes('Arthur')
          )
        ) || voices.find(v => v.lang === 'en-GB');

        if (britishMale) utterance.voice = britishMale;

        utterance.onend = () => {
          speechActiveRef.current = false;
          setIsSpeaking(false);
          setAudioLevel(0);
          if (callback) callback();
        };
        utterance.onerror = () => {
          speechActiveRef.current = false;
          setIsSpeaking(false);
          setAudioLevel(0);
        };

        const intervalId = setInterval(() => {
          if (!speechActiveRef.current) {
            clearInterval(intervalId);
            return;
          }
          setAudioLevel(0.15 + Math.random() * 0.5);
        }, 100);

        synthRef.current.speak(utterance);
      }, []);

      const executeDirective = useCallback((cmd) => {
        const action = cmd.action;
        const label = cmd.label.toLowerCase();

        if (pendingAction) {
          if (label.includes('yes') || label.includes('confirm')) {
            const targetAction = pendingAction;
            setPendingAction(null);
            speakResponse(`Confirmed. Opening ${targetAction.name}.`, () => {
              window.open(targetAction.url, '_blank');
            });
          } else if (label.includes('no') || label.includes('cancel')) {
            setPendingAction(null);
            speakResponse('Action cancelled.');
          }
          return;
        }

        if (action === 'weather') {
          speakResponse(weather.loading ? 'Telemetry calibrating.' : `Temperature is ${weather.temp} degrees, ${weather.condition.toLowerCase()}.`);
        } else if (action === 'time') {
          speakResponse(`Local time is ${new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true })}.`);
        } else if (action === 'diagnostics') {
          speakResponse(`All core sub-routines stable. CPU running at ${cpuLoad} percent.`);
        } else if (action === 'gemini' || action === 'google') {
          const target = webAutomations.find(w => w.keyword === action) || { name: action, url: cmd.url };
          setPendingAction(target);
          speakResponse(`Confirmation, open ${target.name}. Please say yes or no.`);
        } else {
          speakResponse("Directive executed.");
        }
      }, [pendingAction, weather, cpuLoad, webAutomations, speakResponse]);

      const handleVoiceCommand = useCallback((rawText) => {
        const text = (rawText || '').toLowerCase().trim();
        if (!text) return;

        if (pendingAction) {
          if (text.includes('yes') || text.includes('confirm')) {
            const action = pendingAction;
            setPendingAction(null);
            speakResponse(`Confirmed. Opening ${action.name}.`, () => {
              window.open(action.url, '_blank');
            });
          } else if (text.includes('no') || text.includes('cancel')) {
            setPendingAction(null);
            speakResponse('Action cancelled.');
          } else {
            speakResponse('Please confirm with yes or no.');
          }
          return;
        }

        if (text.includes('open ')) {
          const match = webAutomations.find(a => text.includes(a.keyword));
          if (match) {
            setPendingAction(match);
            speakResponse(`Confirmation, open ${match.name}. Please say yes or no.`);
            return;
          }
        }

        if (text.includes('weather')) {
          speakResponse(weather.loading ? 'Telemetry calibrating.' : `Temperature is ${weather.temp} degrees, ${weather.condition.toLowerCase()}.`);
          return;
        }

        if (text.includes('time')) {
          speakResponse(`Local time is ${new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true })}.`);
          return;
        }

        speakResponse('Command processed.');
      }, [pendingAction, webAutomations, weather, speakResponse]);

      const startListening = useCallback(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-GB';

        recognition.onstart = () => {
          setIsListening(true);
          setSystemStatus('LISTENING');
        };

        recognition.onresult = (e) => {
          let currentTranscript = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            currentTranscript += e.results[i][0].transcript;
          }
          setTranscript(currentTranscript);
          if (e.results[e.results.length - 1].isFinal) {
            handleVoiceCommand(currentTranscript);
          }
        };

        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);

        recognitionRef.current = recognition;
        try { recognition.start(); } catch (e) {}
      }, [handleVoiceCommand]);

      const stopListening = useCallback(() => {
        setIsListening(false);
        setSystemStatus('ONLINE & READY');
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
      }, []);

      const initializeJarvis = useCallback(() => {
        setSystemStatus('ONLINE & READY');
        speakResponse("Systems nominal.", () => {
          startListening();
        });
      }, [speakResponse, startListening]);

      const addCustomDirective = (e) => {
        e.preventDefault();
        if (!newDirective.trim()) return;
        setDirectiveCommands([...directiveCommands, { label: newDirective.trim(), action: 'custom' }]);
        setNewDirective('');
      };

      return (
        <div className="min-h-screen w-full bg-obsidian text-slate-100 flex flex-col justify-between relative overflow-hidden p-6 md:p-8">
          <div className="ambient-glow" />

          {/* Header */}
          <header className="relative z-10 flex items-center justify-between pb-4 border-b border-slate-800/80 mb-6">
            <div className="flex items-center gap-3">
              <div className="relative w-7 h-7 flex items-center justify-center">
                <div className="absolute inset-0 rounded-full border-2 border-amberAccent/40 animate-ping" />
                <div className="w-5 h-5 rounded-full border-2 border-amberAccent flex items-center justify-center bg-slate-900">
                  <div className="w-2 h-2 rounded-full bg-amberAccent" />
                </div>
              </div>
              <h1 className="font-brand text-xl md:text-2xl font-bold tracking-widest text-brandWhite">HELIOS' JARVIS</h1>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex bg-slate-900/90 rounded-lg p-1 border border-slate-800 text-xs font-semibold">
                <button onClick={() => setSystemMode('STANDARD')} className={`px-3 py-1 rounded ${systemMode === 'STANDARD' ? 'bg-amberAccent text-obsidian' : 'text-slate-400'}`}>STANDARD</button>
                <button onClick={() => setSystemMode('FOCUS')} className={`px-3 py-1 rounded ${systemMode === 'FOCUS' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>FOCUS</button>
              </div>

              <div className="px-3 py-1.5 rounded-full text-xs font-semibold tracking-wider text-slate-300 bg-slate-900/80 border border-slate-700/60 flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${isListening ? 'bg-amberAccent animate-ping' : 'bg-emerald-400'}`} />
                {systemStatus}
              </div>

              <div className="hidden lg:block font-mono text-xs font-semibold text-brandLightGrey bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-800">
                {time || '00:00:00'}
              </div>
            </div>
          </header>

          {/* Main Content Layout */}
          <main className="relative z-10 grid grid-cols-12 gap-6 my-auto items-stretch">
            
            {/* Left Column: Telemetry & Directive Commands */}
            <div className="col-span-12 lg:col-span-3 flex flex-col justify-between gap-5">
              <div className="glass-card rounded-2xl p-5 border-l-4 border-l-amberAccent">
                <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey mb-1">TELEMETRY & TIME</div>
                <div className="text-xs font-semibold text-brandLightGrey mb-1">{weather.location}</div>
                <div className="text-2xl font-extrabold font-brand text-brandWhite">{time || '00:00:00'}</div>
              </div>

              <div className="glass-card rounded-2xl p-5 border-l-4 border-l-amberAccent">
                <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey mb-2">ENVIRONMENTAL FEED</div>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-3xl font-black text-brandWhite">{weather.temp ?? '--'}°</div>
                    <div className="text-[11px] text-brandGrey mt-0.5">{weather.condition}</div>
                  </div>
                  <div className="text-right border-l border-slate-800 pl-3">
                    <div className="text-[9px] text-slate-500 uppercase tracking-wider">WIND SPEED</div>
                    <div className="text-xs font-bold text-brandLightGrey">{weather.wind ?? '--'} km/h</div>
                  </div>
                </div>
              </div>

              <div className="glass-card rounded-2xl p-5 flex-1 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-3">
                    <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey">DIRECTIVE COMMANDS</div>
                    <span className="text-[9px] text-slate-500 font-mono">CLICKABLE</span>
                  </div>
                  <div className="space-y-2 max-h-[180px] overflow-y-auto pr-1">
                    {directiveCommands.map((cmd, idx) => (
                      <button
                        key={idx}
                        onClick={() => executeDirective(cmd)}
                        className="w-full text-left bg-slate-900/80 hover:bg-slate-800 border border-slate-800/80 p-2.5 rounded-lg text-xs font-medium text-slate-200 transition flex items-center justify-between group"
                      >
                        <span>{cmd.label}</span>
                        <span className="text-[10px] font-mono text-amberAccent opacity-0 group-hover:opacity-150 transition">EXEC</span>
                      </button>
                    ))}
                  </div>
                </div>
                <form onSubmit={addCustomDirective} className="flex gap-2 mt-3 pt-3 border-t border-slate-800">
                  <input
                    type="text"
                    placeholder="Add custom command..."
                    value={newDirective}
                    onChange={e => setNewDirective(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-slate-200 outline-none"
                  />
                  <button type="submit" className="bg-amberAccent hover:bg-amber-600 text-obsidian px-3 rounded font-mono text-xs font-bold transition">+</button>
                </form>
              </div>
            </div>

            {/* Center Core Column */}
            <div className="col-span-12 lg:col-span-6 flex flex-col items-center justify-between gap-4 py-2">
              <div className="w-full h-[380px] relative flex items-center justify-center">
                <Jarvis3DCore isListening={isListening} isSpeaking={isSpeaking} audioLevel={audioLevel} currentMode={systemMode} />
              </div>

              <div className="pt-2 flex flex-col items-center gap-3 w-full">
                <button
                  onClick={isListening ? stopListening : initializeJarvis}
                  className="core-btn px-8 py-3.5 rounded-full font-brand text-xs font-bold tracking-widest flex items-center gap-3 bg-amberAccent text-obsidian shadow-[0_0_30px_rgba(245,158,11,0.4)]"
                >
                  <span className="w-2.5 h-2.5 rounded-full bg-obsidian animate-ping" />
                  {systemStatus === 'OFFLINE' ? "INITIALIZE HELIOS' JARVIS" : isListening ? "HALT VOICE INPUT" : "ACTIVATE VOICE LINK"}
                </button>

                <div className="w-full max-w-md glass-card rounded-2xl p-4 border-t-2 border-t-amberAccent min-h-[75px] flex flex-col justify-center">
                  <div className="text-[9px] font-brand tracking-widest text-brandGrey mb-1 uppercase text-center">COMMUNICATION FEED</div>
                  <div className="text-xs font-mono text-brandWhite text-center">
                    {transcript ? `> ${transcript}` : <span className="text-slate-600">Awaiting voice command input…</span>}
                  </div>
                  {jarvisResponse && (
                    <div className="text-[10px] font-mono mt-1 text-center text-amberAccent/90">
                      JARVIS: "{jarvisResponse}"
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Right Column: System Performance & Web Automator */}
            <div className="col-span-12 lg:col-span-3 flex flex-col justify-between gap-5">
              <div className="glass-card rounded-2xl p-5 border-l-4 border-l-amberAccent">
                <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey mb-3">SYSTEM PERFORMANCE</div>
                <div className="flex flex-col gap-3 font-mono text-xs">
                  <div>
                    <div className="flex justify-between mb-1 text-slate-400"><span>CPU ALLOCATION</span><span>{cpuLoad}%</span></div>
                    <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-800"><div className="h-full bg-amberAccent" style={{ width: `${cpuLoad}%` }} /></div>
                  </div>
                  <div>
                    <div className="flex justify-between mb-1 text-slate-400"><span>MEMORY ALLOCATION</span><span>{memoryLoad}%</span></div>
                    <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-800"><div className="h-full bg-cyanAccent" style={{ width: `${memoryLoad}%` }} /></div>
                  </div>
                </div>
              </div>

              <div className="glass-card rounded-2xl p-5 flex-1 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <div className="text-[10px] font-brand uppercase tracking-widest text-brandGrey">WEB AUTOMATOR</div>
                    <span className="text-[9px] text-slate-500 font-mono">VOICE/CLICK</span>
                  </div>
                  <p className="text-[11px] text-slate-400 mb-3">Say "Open [keyword]" or click shortcuts below to launch instantly:</p>
                  <div className="grid grid-cols-2 gap-2 mb-3">
                    {webAutomations.map((item, idx) => (
                      <button
                        key={idx}
                        onClick={() => {
                          setPendingAction(item);
                          speakResponse(`Confirmation, open ${item.name}. Please say yes or no.`);
                        }}
                        className="text-left bg-slate-900/60 hover:bg-slate-800 border border-slate-800 p-2 rounded text-xs transition group"
                      >
                        <div className="font-bold text-slate-200 group-hover:text-amberAccent">{item.name}</div>
                        <div className="text-[9px] font-mono text-slate-400">say "{item.keyword}"</div>
                      </button>
                    ))}
                  </div>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newKeyword.trim() || !newUrl.trim()) return;
                  let formatted = newUrl.trim();
                  if (!formatted.startsWith('http')) formatted = 'https://' + formatted;
                  setWebAutomations([...webAutomations, { keyword: newKeyword.trim().toLowerCase(), name: newKeyword.trim(), url: formatted }]);
                  setNewKeyword('');
                  setNewUrl('');
                }} className="space-y-2 pt-2 border-t border-slate-800">
                  <input type="text" placeholder="Name (e.g. GitHub)" value={newKeyword} onChange={e => setNewKeyword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-xs font-mono text-slate-200 outline-none" />
                  <input type="text" placeholder="URL (e.g. github.com)" value={newUrl} onChange={e => setNewUrl(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-xs font-mono text-slate-200 outline-none" />
                  <button type="submit" className="w-full bg-amberAccent hover:bg-amber-600 text-obsidian font-mono text-xs py-1.5 rounded font-bold transition">+ ADD SHORTCUT</button>
                </form>
              </div>
            </div>

          </main>

          <footer className="relative z-10 pt-4 mt-2 border-t border-slate-900 flex justify-between items-center text-[10px] font-mono text-slate-600">
            <div>SECURE KERNEL v5.4.2 ACTIVE</div>
            <div>HELIOS NEURAL MATRIX</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
