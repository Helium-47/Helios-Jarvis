<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helios' Jarvis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0f17] text-slate-200 font-sans antialiased min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [status, setStatus] = React.useState("Awaiting voice command input...");
      const [pendingAction, setPendingAction] = React.useState(null);
      const [customCommands, setCustomCommands] = React.useState([
        { keyword: 'open gemini', name: 'Google Gemini', url: 'https://gemini.google.com' },
        { keyword: 'open google', name: 'Google Search', url: 'https://google.com' },
        { keyword: 'open github', name: 'GitHub HQ', url: 'https://github.com' },
        { keyword: 'open youtube', name: 'YouTube', url: 'https://youtube.com' }
      ]);
      const [newKeyword, setNewKeyword] = React.useState('');
      const [newUrl, setNewUrl] = React.useState('');
      const [inputCmd, setInputCmd] = React.useState('');

      const speak = (text, callback) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        
        const voices = window.speechSynthesis.getVoices();
        const britishMale = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('George') || v.name.includes('Oliver') || v.name.includes('Ryan') || v.name.includes('Arthur')));
        if (britishMale) {
          utterance.voice = britishMale;
        } else {
          const gbVoice = voices.find(v => v.lang === 'en-GB');
          if (gbVoice) utterance.voice = gbVoice;
        }

        utterance.pitch = 0.85;
        utterance.rate = 1.0;

        if (callback) {
          utterance.onend = callback;
        }
        window.speechSynthesis.speak(utterance);
      };

      React.useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
      }, []);

      const initializeJarvis = () => {
        setStatus("Helios' Jarvis Online & Stable.");
        speak("Welcome back, sir. Systems are all stable and operating at maximum efficiency.");
      };

      const handleCommand = (rawText) => {
        const cmd = rawText.toLowerCase().trim();

        if (pendingAction) {
          if (cmd.includes('yes') || cmd.includes('confirm')) {
            setStatus(`Executing: ${pendingAction.name}`);
            speak(`Executing ${pendingAction.name}`, () => {
              window.open(pendingAction.url, '_blank');
            });
            setPendingAction(null);
          } else if (cmd.includes('no') || cmd.includes('cancel')) {
            setStatus("Action cancelled.");
            speak("Cancel action.");
            setPendingAction(null);
          } else {
            speak("Please respond with yes or no, sir.");
          }
          return;
        }

        const matched = customCommands.find(c => cmd.includes(c.keyword.toLowerCase()));
        if (matched) {
          setPendingAction(matched);
          setStatus(`Confirmation: Open ${matched.name}?`);
          speak(`Confirmation open ${matched.name}. Please say yes or no.`);
          return;
        }

        if (cmd === "what's the weather?") {
          setStatus("Environmental Feed: 28 degrees, Overcast.");
          speak("The temperature is 28 degrees with overcast conditions, sir.");
        } else if (cmd === "what time is it?") {
          const timeStr = new Date().toLocaleTimeString();
          setStatus(`Telemetry Time: ${timeStr}`);
          speak(`The current time is ${timeStr}, sir.`);
        } else if (cmd === "system diagnostics") {
          setStatus("Diagnostics: CPU 16%, Memory 31%. All systems optimal.");
          speak("System diagnostics complete. CPU and memory allocations are optimal.");
        } else {
          setStatus(`Command not recognized: "${rawText}"`);
          speak("Command not recognized, sir.");
        }
      };

      const addCustomCommand = (e) => {
        e.preventDefault();
        if (!newKeyword || !newUrl) return;
        let formattedUrl = newUrl.trim();
        if (!formattedUrl.startsWith('http')) {
          formattedUrl = 'https://' + formattedUrl;
        }
        setCustomCommands([...customCommands, { keyword: newKeyword.trim().toLowerCase(), name: newKeyword.trim(), url: formattedUrl }]);
        setNewKeyword('');
        setNewUrl('');
      };

      return (
        <div className="p-6 max-w-7xl mx-auto">
          <header className="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
              <h1 className="text-xl font-bold tracking-wider text-amber-400">HELIOS' JARVIS</h1>
            </div>
            <div className="flex items-center gap-4">
              <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 animate-ping"></span> ONLINE & READY
              </span>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="space-y-6">
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-lg">
                <h2 className="text-xs font-mono text-slate-500 mb-1">TELEMETRY & TIME</h2>
                <div className="text-2xl font-mono font-bold text-amber-400">{new Date().toLocaleTimeString()}</div>
                <div className="text-xs font-mono text-slate-400 mt-1">22.34°N, 114.18°E</div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-lg">
                <h2 className="text-xs font-mono text-slate-500 mb-1">ENVIRONMENTAL FEED</h2>
                <div className="text-2xl font-mono font-bold text-slate-100">28° <span className="text-xs font-normal text-slate-400">Overcast</span></div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-lg">
                <h2 className="text-xs font-mono text-slate-500 mb-3">DIRECTIVE COMMANDS</h2>
                <div className="space-y-2">
                  <button onClick={() => handleCommand("What's the weather?")} className="w-full text-left bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 p-2.5 rounded text-xs font-mono text-slate-300 transition">What's the weather?</button>
                  <button onClick={() => handleCommand("What time is it?")} className="w-full text-left bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 p-2.5 rounded text-xs font-mono text-slate-300 transition">What time is it?</button>
                  <button onClick={() => handleCommand("System diagnostics")} className="w-full text-left bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 p-2.5 rounded text-xs font-mono text-slate-300 transition">System diagnostics</button>
                </div>
              </div>
            </div>

            <div className="flex flex-col items-center justify-between bg-slate-900/40 border border-slate-800/80 p-6 rounded-lg lg:col-span-1">
              <div className="text-center w-full">
                <h2 className="text-xs font-mono text-slate-500 mb-6">CORE SYSTEM MATRIX</h2>
                <div className="w-48 h-48 mx-auto rounded-full border border-amber-500/30 flex items-center justify-center relative shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                  <div className="absolute inset-2 rounded-full border border-cyan-500/30 animate-spin" style={{animationDuration: '12s'}}></div>
                  <div className="absolute inset-6 rounded-full border border-dashed border-amber-500/20 animate-spin" style={{animationDuration: '20s', animationDirection: 'reverse'}}></div>
                  <div className="w-16 h-16 rounded-full bg-amber-500/20 border border-amber-400 flex items-center justify-center font-mono text-amber-400 text-xs">AI</div>
                </div>
              </div>

              <div className="w-full mt-6">
                <button 
                  onClick={initializeJarvis}
                  className="w-full py-3 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-400 rounded font-mono text-xs tracking-widest transition shadow-lg"
                >
                  INITIALIZE HELIOS' JARVIS
                </button>
              </div>

              <div className="w-full mt-4 bg-slate-900 border border-slate-800 p-3 rounded text-center">
                <span className="text-[10px] font-mono text-slate-500 block">COMMUNICATION FEED</span>
                <span className="text-amber-400 font-mono text-xs">{status}</span>
              </div>
            </div>

            <div className="space-y-6">
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-lg">
                <h2 className="text-xs font-mono text-slate-500 mb-3">SYSTEM PERFORMANCE</h2>
                <div className="space-y-3 font-mono text-xs">
                  <div>
                    <div className="flex justify-between mb-1 text-slate-400"><span>CPU ALLOCATION</span><span>16%</span></div>
                    <div className="w-full bg-slate-800 h-1.5 rounded overflow-hidden"><div className="bg-amber-400 h-full w-[16%]"></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between mb-1 text-slate-400"><span>MEMORY ALLOCATION</span><span>31%</span></div>
                    <div className="w-full bg-slate-800 h-1.5 rounded overflow-hidden"><div className="bg-cyan-400 h-full w-[31%]"></div></div>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-lg">
                <h2 className="text-xs font-mono text-slate-500 mb-2">VOICE AUTOMATOR & CONFIRMATION</h2>
                <p className="text-[11px] text-slate-400 mb-3 font-mono">Say a command like <span className="text-amber-400">"open gemini"</span>. Jarvis will ask for confirmation before execution.</p>
                
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {customCommands.map((item, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => handleCommand(item.keyword)}
                      className="bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 p-2.5 rounded text-left transition"
                    >
                      <div className="text-xs font-bold text-slate-200">{item.name}</div>
                      <div className="text-[10px] font-mono text-amber-400">say: "{item.keyword}"</div>
                    </button>
                  ))}
                </div>

                <form onSubmit={addCustomCommand} className="space-y-2 pt-2 border-t border-slate-800">
                  <input 
                    type="text" 
                    placeholder="Command name (e.g. Open Twitter)" 
                    value={newKeyword} 
                    onChange={e => setNewKeyword(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-slate-200 focus:border-amber-400 outline-none"
                  />
                  <input 
                    type="text" 
                    placeholder="Website URL (e.g. twitter.com)" 
                    value={newUrl} 
                    onChange={e => setNewUrl(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-slate-200 focus:border-amber-400 outline-none"
                  />
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-black font-mono text-xs py-1.5 rounded font-bold transition">+ ADD COMMAND</button>
                </form>
              </div>
            </div>
          </div>

          <div className="mt-8 flex gap-2">
            <input 
              type="text" 
              placeholder="Type command here (e.g., open gemini, yes, no)..." 
              value={inputCmd}
              onChange={e => setInputCmd(e.target.value)}
              onKeyDown={e => {
                if (e.key === 'Enter') {
                  handleCommand(inputCmd);
                  setInputCmd('');
                }
              }}
              className="flex-1 bg-slate-900 border border-slate-800 rounded px-4 py-2 font-mono text-xs text-slate-200 focus:border-amber-400 outline-none"
            />
            <button 
              onClick={() => { handleCommand(inputCmd); setInputCmd(''); }}
              className="bg-amber-500/20 border border-amber-500/50 hover:bg-amber-500/30 text-amber-400 px-6 py-2 rounded font-mono text-xs transition"
            >
              EXECUTE
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
